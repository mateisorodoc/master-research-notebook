  <main id="mainContent" class="page-wrap" tabindex="-1">
    <h1>Mastery Arcade &amp; Capstone Exam</h1>
    <p class="muted">Build your combo multiplier (<code>2x</code> → <code>3x</code> → <code>5x</code> XP) across 5 game modes and pass the 3-step <strong>Zero-to-Hero Capstone Diagnostic</strong>.</p>

    <div class="pack-tabs" role="tablist" aria-label="Mini-games">
      <button class="btn btn-sm g-tab" type="button" data-g="blank" aria-pressed="true">1. Complete Code / Formula</button>
      <button class="btn btn-sm g-tab" type="button" data-g="match" aria-pressed="false">2. Link Concepts</button>
      <button class="btn btn-sm g-tab" type="button" data-g="order" aria-pressed="false">3. Order the Pipeline</button>
      <button class="btn btn-sm g-tab" type="button" data-g="flaw" aria-pressed="false">4. Spot the Flaw</button>
      <button class="btn btn-sm g-tab" type="button" data-g="blitz" aria-pressed="false">5. 60s Blitz</button>
      <button class="btn btn-sm btn-gold g-tab" type="button" data-g="capstone" aria-pressed="false">★ Capstone Exam</button>
    </div>

    <section id="gameBlank" class="surface"></section>
    <section id="gameMatch" class="surface" hidden></section>
    <section id="gameOrder" class="surface" hidden></section>
    <section id="gameFlaw" class="surface" hidden></section>
    <section id="gameBlitz" class="surface" hidden></section>
    <section id="gameCapstone" class="surface" hidden></section>

  <script src="notebook-data.js"></script>
  <script src="shared.js"></script>
  <script>
    (function () {
      const FULL = window.NOTEBOOK_DATA;
      const DATA = FULL.arcade;
      const State = window.NotebookState;

      const panes = {
        blank: document.getElementById("gameBlank"),
        match: document.getElementById("gameMatch"),
        order: document.getElementById("gameOrder"),
        flaw: document.getElementById("gameFlaw"),
        blitz: document.getElementById("gameBlitz"),
        capstone: document.getElementById("gameCapstone")
      };

      function activateGameTab(g) {
        State.playSound("tap");
        document.querySelectorAll(".g-tab").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.g === g)));
        Object.entries(panes).forEach(([k, el]) => { el.hidden = k !== g; });
      }

      document.querySelectorAll(".g-tab").forEach((btn) => {
        btn.addEventListener("click", () => activateGameTab(btn.dataset.g));
      });

      const urlTab = new URLSearchParams(window.location.search).get("tab");
      if (urlTab && panes[urlTab]) activateGameTab(urlTab);

      // --- Game 1: Complete the Sentence / Code ---
      let bIdx = 0;
      function renderBlank() {
        const item = DATA.fillBlanks[bIdx];
        const shuffled = [...item.choices].sort(() => Math.random() - 0.5);
        panes.blank.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="tag tag-blue">Round ${bIdx + 1} / ${DATA.fillBlanks.length}</span>
            <button id="nextBlankBtn" class="btn btn-sm" type="button">Next Round →</button>
          </div>
          <p style="font-size:17px; line-height:1.7;">
            ${item.prompt} <span id="blankSlot" class="blank-slot">_____</span> ${item.after}
          </p>
          <div class="chip-bank">
            ${shuffled.map((c) => `<button class="game-chip b-chip" type="button" data-val="${c}">${c}</button>`).join("")}
          </div>
          <div id="blankFb" class="note-box" hidden></div>
        `;
        panes.blank.querySelectorAll(".b-chip").forEach((ch) => {
          ch.addEventListener("click", () => {
            const ok = ch.dataset.val === item.blank;
            document.getElementById("blankSlot").textContent = ch.dataset.val;
            const fb = document.getElementById("blankFb");
            fb.hidden = false;
            fb.className = `note-box ${ok ? "good" : "warn"}`;
            fb.textContent = (ok ? "Correct! " : `Not quite (answer: ${item.blank}). `) + item.explain;
            ch.classList.add(ok ? "matched" : "wrong");
            if (ok) State.awardXP(15, "Fill-in-Blank");
            else State.resetStreak({ q: `${item.prompt} _____ ${item.after}`, options: item.choices, answer: item.choices.indexOf(item.blank), explain: item.explain });
          });
        });
        document.getElementById("nextBlankBtn").addEventListener("click", () => {
          bIdx = (bIdx + 1) % DATA.fillBlanks.length;
          renderBlank();
        });
      }
      renderBlank();

      // --- Game 2: Link Concepts ---
      let deckIdx = 0;
      function renderMatch() {
        const deck = DATA.matchDecks[deckIdx];
        const lefts = deck.pairs.map((p, i) => ({ text: p.left, id: i }));
        const rights = deck.pairs.map((p, i) => ({ text: p.right, id: i })).sort(() => Math.random() - 0.5);
        let selL = null, selR = null;
        let matched = 0;

        panes.match.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <h2 style="margin:0; font-size:20px;">${deck.title}</h2>
            <button id="nextDeckBtn" class="btn btn-sm" type="button">Switch Deck →</button>
          </div>
          <p class="muted" style="font-size:14px;">Tap one item on the left, then tap its matching partner on the right.</p>
          <div class="grid-2">
            <div class="chip-bank" style="flex-direction:column;" id="mLeftCol">
              ${lefts.map((l) => `<button class="game-chip" type="button" data-side="L" data-id="${l.id}">${l.text}</button>`).join("")}
            </div>
            <div class="chip-bank" style="flex-direction:column;" id="mRightCol">
              ${rights.map((r) => `<button class="game-chip" type="button" data-side="R" data-id="${r.id}">${r.text}</button>`).join("")}
            </div>
          </div>
          <div id="matchFb" class="note-box good" hidden>Deck Cleared! +25 XP</div>
        `;

        function checkPair() {
          if (!selL || !selR) return;
          if (selL.dataset.id === selR.dataset.id) {
            selL.classList.remove("selected"); selR.classList.remove("selected");
            selL.classList.add("matched"); selR.classList.add("matched");
            selL.disabled = true; selR.disabled = true;
            matched++;
            State.awardXP(10, "Match");
            if (matched === deck.pairs.length) {
              document.getElementById("matchFb").hidden = false;
              State.awardXP(25, "Deck Clear");
            }
          } else {
            selL.classList.add("wrong"); selR.classList.add("wrong");
            State.resetStreak();
            const a = selL, b = selR;
            setTimeout(() => { a.classList.remove("wrong", "selected"); b.classList.remove("wrong", "selected"); }, 450);
          }
          selL = null; selR = null;
        }

        panes.match.querySelectorAll(".game-chip").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (btn.dataset.side === "L") {
              panes.match.querySelectorAll('[data-side="L"]').forEach((x) => x.classList.remove("selected"));
              selL = btn; btn.classList.add("selected");
            } else {
              panes.match.querySelectorAll('[data-side="R"]').forEach((x) => x.classList.remove("selected"));
              selR = btn; btn.classList.add("selected");
            }
            checkPair();
          });
        });

        document.getElementById("nextDeckBtn").addEventListener("click", () => {
          deckIdx = (deckIdx + 1) % DATA.matchDecks.length;
          renderMatch();
        });
      }
      renderMatch();

      // --- Game 3: Order the Pipeline ---
      let oIdx = 0;
      function renderOrder() {
        const pipes = FULL.orderPipelines || [];
        const p = pipes[oIdx];
        const scrambled = p.steps.map((text, idx) => ({ text, idx })).sort(() => Math.random() - 0.5);
        let expected = 0;

        panes.order.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="tag tag-purple">Pipeline ${oIdx + 1} / ${pipes.length}</span>
            <button id="nextOrderBtn" class="btn btn-sm" type="button">Switch Pipeline →</button>
          </div>
          <h2 style="font-size:20px; margin-bottom:6px;">${p.title}</h2>
          <p class="muted" style="font-size:14px;">Tap the steps below in exact execution order (Step 1 → Step ${p.steps.length}):</p>
          <div class="quiz-options" id="orderList">
            ${scrambled.map((s) => `<button class="quiz-opt ord-btn" type="button" data-idx="${s.idx}">${s.text}</button>`).join("")}
          </div>
          <div id="orderFb" class="note-box good" hidden>${p.explain}</div>
        `;

        panes.order.querySelectorAll(".ord-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.dataset.idx, 10);
            if (idx === expected) {
              btn.classList.add("correct");
              btn.disabled = true;
              expected++;
              State.awardXP(10, "Pipeline Step");
              if (expected === p.steps.length) {
                document.getElementById("orderFb").hidden = false;
                State.awardXP(25, "Pipeline Ordered");
              }
            } else {
              btn.classList.add("wrong");
              State.resetStreak();
              setTimeout(() => btn.classList.remove("wrong"), 450);
            }
          });
        });

        document.getElementById("nextOrderBtn").addEventListener("click", () => {
          oIdx = (oIdx + 1) % pipes.length;
          renderOrder();
        });
      }
      renderOrder();

      // --- Game 4: Spot the Flaw ---
      let fIdx = 0;
      function renderFlaw() {
        const item = DATA.spotFlaws[fIdx];
        panes.flaw.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="tag tag-coral">Reviewer Case ${fIdx + 1} / ${DATA.spotFlaws.length}</span>
            <button id="nextFlawBtn" class="btn btn-sm" type="button">Next Case →</button>
          </div>
          <div class="note-box warn"><strong>Scenario:</strong> ${item.scenario}</div>
          <p style="font-weight:600; margin-bottom:6px;">What is the engineering flaw?</p>
          <div class="quiz-options">
            ${item.options.map((o, i) => `<button class="quiz-opt f-opt" type="button" data-i="${i}">${o}</button>`).join("")}
          </div>
          <p id="flawFb" class="muted" style="margin:10px 0 0;" hidden></p>
        `;
        panes.flaw.querySelectorAll(".f-opt").forEach((btn) => {
          btn.addEventListener("click", () => {
            const pick = parseInt(btn.dataset.i, 10);
            panes.flaw.querySelectorAll(".f-opt").forEach((b, idx) => {
              b.classList.remove("correct", "wrong");
              if (idx === item.answer) b.classList.add("correct");
              else if (idx === pick) b.classList.add("wrong");
            });
            const fb = document.getElementById("flawFb");
            fb.hidden = false;
            fb.textContent = item.explain;
            if (pick === item.answer) State.awardXP(20, "Reviewer Catch");
            else State.resetStreak({ q: item.scenario, options: item.options, answer: item.answer, explain: item.explain });
          });
        });
        document.getElementById("nextFlawBtn").addEventListener("click", () => {
          fIdx = (fIdx + 1) % DATA.spotFlaws.length;
          renderFlaw();
        });
      }
      renderFlaw();

      // --- Game 5: 60-Second Blitz ---
      const allPool = [];
      FULL.concepts.forEach((c) => c.trivia.forEach((t) => allPool.push(t)));
      DATA.spotFlaws.forEach((f) => allPool.push({ q: f.scenario, options: f.options, answer: f.answer, explain: f.explain }));
      let blitzTimer = null, blitzSec = 60, blitzScore = 0;

      function renderBlitzIdle() {
        clearInterval(blitzTimer);
        panes.blitz.innerHTML = `
          <h2 style="margin-top:0;">60-Second Speed Blitz</h2>
          <p class="muted">Answer as many rapid-fire questions as you can in 60 seconds to build a 5x Combo Multiplier!</p>
          <button id="startBlitzBtn" class="btn btn-primary" type="button">Start 60s Blitz →</button>
        `;
        document.getElementById("startBlitzBtn").addEventListener("click", () => {
          blitzSec = 60;
          blitzScore = 0;
          nextBlitzQuestion();
          blitzTimer = setInterval(() => {
            blitzSec--;
            const tEl = document.getElementById("blitzClock");
            if (tEl) tEl.textContent = `${blitzSec}s`;
            if (blitzSec <= 0) {
              clearInterval(blitzTimer);
              panes.blitz.innerHTML = `
                <h2>Time's Up! Blitz Score: ${blitzScore} Correct</h2>
                <button id="retryBlitzBtn" class="btn btn-primary" type="button">Play Again</button>
              `;
              document.getElementById("retryBlitzBtn").addEventListener("click", renderBlitzIdle);
            }
          }, 1000);
        });
      }

      function nextBlitzQuestion() {
        const q = allPool[Math.floor(Math.random() * allPool.length)];
        panes.blitz.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="tag tag-gold" id="blitzClock">${blitzSec}s</span>
            <span class="tag tag-green">Blitz Score: ${blitzScore}</span>
          </div>
          <p style="font-weight:600; font-size:16px;">${q.q}</p>
          <div class="quiz-options">
            ${q.options.map((o, i) => `<button class="quiz-opt bl-opt" type="button" data-i="${i}">${o}</button>`).join("")}
          </div>
        `;
        panes.blitz.querySelectorAll(".bl-opt").forEach((btn) => {
          btn.addEventListener("click", () => {
            const pick = parseInt(btn.dataset.i, 10);
            if (pick === q.answer) {
              blitzScore++;
              State.awardXP(15, "Blitz");
            } else {
              State.resetStreak(q);
            }
            nextBlitzQuestion();
          });
        });
      }
      renderBlitzIdle();

      // --- Capstone Challenge (Final Boss) ---
      function renderCapstone() {
        const cap = FULL.capstoneChallenge;
        let passed = new Array(cap.steps.length).fill(false);
        panes.capstone.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <h2 style="margin:0;">${cap.title}</h2>
            <span class="tag tag-gold">Grandmaster Certification (+100 XP)</span>
          </div>
          <div class="note-box warn">${cap.scenario}</div>
          ${cap.steps.map((s, si) => `
            <div class="surface-lab" data-csi="${si}">
              <h3>${s.stepTitle}</h3>
              <p style="font-weight:600;">${s.q}</p>
              <div class="quiz-options">
                ${s.options.map((o, oi) => `<button class="quiz-opt cap-opt" type="button" data-oi="${oi}">${o}</button>`).join("")}
              </div>
              <p class="muted cap-fb" style="margin:10px 0 0; font-size:13.5px;" hidden></p>
            </div>
          `).join("")}
          <div id="capDoneBanner" class="note-box good" hidden>
            <strong>★ Capstone Diagnostic Cleared! (+100 XP)</strong> You demonstrated full end-to-end mastery of causal preprocessing, multi-actuator decoupling, and anti-inverse-crime validation.
          </div>
        `;

        panes.capstone.querySelectorAll(".cap-opt").forEach((btn) => {
          btn.addEventListener("click", () => {
            const box = btn.closest("[data-csi]");
            const si = parseInt(box.dataset.csi, 10);
            const oi = parseInt(btn.dataset.oi, 10);
            const step = cap.steps[si];
            const fb = box.querySelector(".cap-fb");

            box.querySelectorAll(".cap-opt").forEach((b, idx) => {
              b.classList.remove("correct", "wrong");
              if (idx === step.answer) b.classList.add("correct");
              else if (idx === oi) b.classList.add("wrong");
            });
            fb.hidden = false;
            fb.textContent = step.explain;

            if (oi === step.answer) {
              if (!passed[si]) State.awardXP(25, `Capstone Step ${si + 1}`);
              passed[si] = true;
              if (passed.every(Boolean)) {
                State.completeCapstone();
                document.getElementById("capDoneBanner").hidden = false;
              }
            } else {
              State.resetStreak(step);
            }
          });
        });
      }
      renderCapstone();
    })();
  </script>
</body>
