  <script src="notebook-data.js"></script>
  <script src="shared.js"></script>
  <script>
    (function () {
      const items = window.NOTEBOOK_DATA.glossary;
      const cats = ["All", ...new Set(items.map((x) => x.cat))];
      let activeCat = "All";

      const catsEl = document.getElementById("gCats");
      const gridEl = document.getElementById("gGrid");
      const searchEl = document.getElementById("gSearch");

      catsEl.innerHTML = cats
        .map((c) => `<button class="btn btn-sm c-btn" type="button" data-cat="${c}" aria-pressed="${c === "All"}">${c}</button>`)
        .join("");

      function render() {
        const q = searchEl.value.trim().toLowerCase();
        const filtered = items.filter((g) => {
          const catOk = activeCat === "All" || g.cat === activeCat;
          const qOk = !q || g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q);
          return catOk && qOk;
        });
        gridEl.innerHTML = filtered.length
          ? filtered
              .map(
                (g) => `
            <div class="surface" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between; gap:10px;">
              <div>
                <span class="tag tag-blue" style="margin-bottom:8px;">${g.cat}</span>
                <h3 style="color:var(--b1b-blue);">${g.term}</h3>
                <p class="muted" style="font-size:14.5px; margin:0;">${g.def}</p>
              </div>
              <a class="btn btn-sm" href="learn.html?concept=${g.concept}">Study in Mastery Pack →</a>
            </div>`
              )
              .join("")
          : `<p class="muted">No glossary entries match "${q}".</p>`;
      }

      catsEl.querySelectorAll(".c-btn").forEach((b) =>
        b.addEventListener("click", () => {
          activeCat = b.dataset.cat;
          catsEl.querySelectorAll(".c-btn").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.cat === activeCat)));
          render();
        })
      );
      searchEl.addEventListener("input", render);
      render();
    })();
  </script>
